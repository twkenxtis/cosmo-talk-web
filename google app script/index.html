<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmo RefreshToken 取得工具</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      color: #000000;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .wrap {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #000000;
    }
    h1 {
      margin: 0;
      font-size: 18px;
    }
    .desc {
      margin: 10px 0 14px;
      font-size: 13px;
      color: #333333;
    }
    .block {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #000000;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: bold;
    }
    .lang-wrap label {
      display: inline;
      margin: 0 4px 0 0;
      font-size: 12px;
      font-weight: normal;
    }
    input[type="email"],
    input[type="text"],
    select,
    textarea {
      border: 1px solid #000000;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      padding: 5px 7px;
    }
    input[type="email"],
    input[type="text"],
    textarea {
      width: 100%;
    }
    select {
      font-size: 12px;
      padding: 3px 6px;
    }
    button {
      margin-top: 8px;
      margin-right: 6px;
      padding: 5px 12px;
      border: 1px solid #000000;
      background: #000000;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    button.sub {
      background: #ffffff;
      color: #000000;
    }
    button:disabled {
      border-color: #999999;
      background: #eeeeee;
      color: #888888;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #000000;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status.show {
      display: block;
    }
    .status.err {
      font-weight: bold;
    }
    #resultBox {
      display: none;
    }
    #resultBox.show {
      display: block;
    }
    textarea {
      min-height: 80px;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      resize: vertical;
    }
    .warn {
      margin-top: 6px;
      font-size: 12px;
      color: #333333;
    }

    .header-actions { display:flex; align-items:center; gap:10px; }
    .github-button {
      display:inline-flex; flex:0 0 36px; width:36px; height:36px;
      align-items:center; justify-content:center; border:1px solid #000;
      background:#fff; color:#000; text-decoration:none;
    }
    .github-button svg { display:block; width:22px; height:22px; }
    .trust-warning {
      display:flex; flex-direction:column; gap:3px; margin:12px 0 14px;
      padding:10px 12px; border:1px solid #b45309; border-left:4px solid #d97706;
      background:#fff7ed; color:#9a3412; font-size:13px;
    }
    .return-button {
      display:block; width:100%; margin:8px 0; padding:8px 12px;
      border:1px solid #000; background:#000; color:#fff; font-size:13px;
      font-weight:bold; text-align:center; text-decoration:none;
    }
    .return-button:hover { background:#333; }
    @media (max-width:420px) {
      .header { align-items:flex-start; }
      .header-actions { gap:6px; }
      .github-button { flex-basis:34px; width:34px; height:34px; }
    }
  </style>
</head>

    <div class="header">
      <h1 data-i18n="heading">Cosmo RefreshToken 工具</h1>

        </div>
      </div>
    </div>

    <div class="desc" data-i18n="desc">步驟 1：輸入 Email 發送驗證碼 → 步驟 2：輸入驗證碼取得 RefreshToken。</div>

    <div class="trust-warning" role="alert">
      <strong>安全警語</strong>
      <span>你應該只在信任的開發者使用這個網站。如果不信任或無法識別是否為真實網站，請回退到其他方法。</span>
    </div>

    <div>
      <label for="emailInput" data-i18n="emailLabel">帳號 Email</label>
      <input id="emailInput" type="email" placeholder="name@example.com" data-i18n-placeholder="emailPlaceholder" autocomplete="email" />
      <button id="sendOtpBtn" type="button" onclick="handleSendOtp()" data-i18n="sendOtpBtn">1. 發送驗證碼</button>
      <button id="resetBtn" class="sub" type="button" onclick="handleReset()" data-i18n="resetBtn">重設</button>
    </div>

    <div class="block">
      <label for="otpInput" data-i18n="otpLabel">OTP 驗證碼（1～6 碼）</label>
      <input id="otpInput" type="text" maxlength="6" placeholder="輸入收到的驗證碼" data-i18n-placeholder="otpPlaceholder" inputmode="numeric" />
      <button id="loginBtn" type="button" onclick="handleLogin()" disabled data-i18n="loginBtn">2. 取得 RefreshToken</button>
    </div>

    <div id="statusBox" class="status"></div>

    <div id="resultBox" class="block">
      <label for="tokenOutput" data-i18n="tokenLabel">RefreshToken</label>
      <textarea id="tokenOutput" readonly></textarea>
      <button id="copyBtn" type="button" onclick="handleCopy()" data-i18n="copyBtn">一鍵複製</button>
      <a class="return-button" href="https://twkenxtis.github.io/cosmo-talk-web/"
         target="_blank" rel="noopener noreferrer">點我回到 Cosmo Talk WEB</a>
      <button id="clearTokenBtn" class="sub" type="button" onclick="handleClearToken()" data-i18n="clearBtn">清除顯示</button>
      <div class="warn" data-i18n="warnNote">請妥善保管此 RefreshToken，勿公開分享或洩漏。</div>
    </div>
  </div>

    const LANG_STORAGE_KEY = "cosmo_gas_ui_lang";
    let currentLang = "zh-TW";
    let isBusy = false;
    let otpSent = false;

    function t(key) {
      const dict = TRANSLATIONS[currentLang] || TRANSLATIONS["zh-TW"];
      return dict[key] || TRANSLATIONS["zh-TW"][key] || key;
    }

    function applyLanguage(lang, persist) {
      currentLang = TRANSLATIONS[lang] ? lang : "zh-TW";
      document.documentElement.lang = currentLang;
      document.title = t("pageTitle");

      const selectEl = document.getElementById("langSelect");
      if (selectEl && selectEl.value !== currentLang) {
        selectEl.value = currentLang;
      }

      if (persist) {
        try {
          localStorage.setItem(LANG_STORAGE_KEY, currentLang);
        } catch (_) {}
      }

      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        const key = el.getAttribute("data-i18n");
        if (key) el.textContent = t(key);
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
        const key = el.getAttribute("data-i18n-placeholder");
        if (key) el.setAttribute("placeholder", t(key));
      });
    }

    function initLangSelector(defaultLang) {
      const selectEl = document.getElementById("langSelect");
      selectEl.innerHTML = "";
      I18N_OPTIONS.forEach(function (opt) {
        const option = document.createElement("option");
        option.value = opt.value;
        option.textContent = opt.label;
        selectEl.appendChild(option);
      });

      let saved = null;
      try {
        saved = localStorage.getItem(LANG_STORAGE_KEY);
      } catch (_) {}

      selectEl.addEventListener("change", function (e) {
        applyLanguage(e.target.value, true);
      });

      applyLanguage(saved || defaultLang || "zh-TW", false);
    }

    function setStatus(type, msg) {
      const box = document.getElementById("statusBox");
      box.className = "status show " + type;
      box.textContent = msg;
    }

    function clearStatus() {
      const box = document.getElementById("statusBox");
      box.className = "status";
      box.textContent = "";
    }

    function syncButtons() {
      const email = document.getElementById("emailInput").value.trim();
      const otp = document.getElementById("otpInput").value.trim();
      document.getElementById("sendOtpBtn").disabled = isBusy || !email;
      document.getElementById("resetBtn").disabled = isBusy;
      document.getElementById("loginBtn").disabled = isBusy || !otpSent || !email || !otp;
    }

    function handleSendOtp() {
      if (isBusy) return;
      const email = document.getElementById("emailInput").value.trim();
      if (!email) {
        setStatus("err", t("errEmptyEmail"));
        return;
      }

      isBusy = true;
      syncButtons();
      setStatus("info", t("infoSendingOtp"));

      google.script.run
        .withSuccessHandler(function (res) {
          isBusy = false;
          if (res && res.ok) {
            otpSent = true;
            setStatus("ok", t("okOtpSent"));
            document.getElementById("otpInput").focus();
          } else {
            setStatus("err", (res && res.error) || t("errSendOtp"));
          }
          syncButtons();
        })
        .withFailureHandler(function (err) {
          isBusy = false;
          setStatus("err", t("errSystem") + (err && err.message ? err.message : String(err)));
          syncButtons();
        })
        .sendOtpCode(email);
    }

    function handleLogin() {
      if (isBusy) return;
      const email = document.getElementById("emailInput").value.trim();
      const code = document.getElementById("otpInput").value.trim();
      if (!email || !code) {
        setStatus("err", t("errMissingFields"));
        return;
      }

      isBusy = true;
      syncButtons();
      setStatus("info", t("infoLoggingIn"));

      google.script.run
        .withSuccessHandler(function (res) {
          isBusy = false;
          if (res && res.ok && res.refreshToken) {
            document.getElementById("tokenOutput").value = res.refreshToken;
            document.getElementById("resultBox").classList.add("show");
            setStatus("ok", t("okLogin"));
          } else {
            setStatus("err", (res && res.error) || t("errLogin"));
          }
          syncButtons();
        })
        .withFailureHandler(function (err) {
          isBusy = false;
          setStatus("err", t("errSystem") + (err && err.message ? err.message : String(err)));
          syncButtons();
        })
        .verifyOtpAndGetRefreshToken(email, code);
    }

    function handleCopy() {
      const ta = document.getElementById("tokenOutput");
      const val = ta.value;
      if (!val) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(
          function () {
            setStatus("ok", t("okCopied"));
          },
          function () {
            fallbackCopy(ta);
          }
        );
      } else {
        fallbackCopy(ta);
      }
    }

    function fallbackCopy(ta) {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try {
        document.execCommand("copy");
        setStatus("ok", t("okCopied"));
      } catch (_) {
        setStatus("err", t("errCopyFallback"));
      }
    }

    function handleClearToken() {
      document.getElementById("tokenOutput").value = "";
      document.getElementById("resultBox").classList.remove("show");
      setStatus("info", t("infoCleared"));
    }

    function handleReset() {
      if (isBusy) return;
      otpSent = false;
      document.getElementById("emailInput").value = "";
      document.getElementById("otpInput").value = "";
      document.getElementById("tokenOutput").value = "";
      document.getElementById("resultBox").classList.remove("show");
      clearStatus();
      syncButtons();
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("emailInput").addEventListener("input", syncButtons);
      document.getElementById("otpInput").addEventListener("input", function (e) {
        e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, "").slice(0, 6);
        syncButtons();
      });

      initLangSelector("zh-TW");
      syncButtons();
    });
  </script>
</body>
</html>
